<div class="breadcrumb">
  <div class="inner">
    @if (phunk(); as phunk) {

      @if (true) {
        <div class="crumbs-wrapper">
          <div class="crumbs">
            <button [routerLink]="['/', 'curated', phunk.slug]">
              {{ phunk.collection?.name }}
            </button>
            <span class="divider">/</span>
            <span class="number">{{ phunk.slug === 'ethsrocks' ? '-' + (phunk.tokenId < 0 ? -phunk.tokenId : phunk.tokenId) : (phunk.tokenId < 0 ? -phunk.tokenId : phunk.tokenId) }}</span>
          </div>

          <div class="save-pfp">
            <button
              (click)="togglePfpOptions()"
              [class.active]="pfpOptionsActive()"
              [class.disabled]="!downloadEnabled()">

              {{ pfpOptionsActive() ? t('cancel') : t('downloadPfp') }}
            </button>
          </div>
        </div>

        @if (pfpOptionsActive()) {
          <div class="pfp-options-wrapper">

            <div class="pfp-options">
              <div
                class="shape-select"
                [class.disabled]="!customizeEnabled()">

                <input
                  type="checkbox"
                  id="transparent"
                  name="transparent"
                  value="transparent"
                  [formControl]="transparentCheck"
                />
                <label for="transparent">{{ t('transparent') }}</label>
              </div>
            </div>

            <div class="actions-wrapper">
              <button (click)="downloadCanvas()">{{ t('save') }}</button>
            </div>
          </div>
        }
      }

    } @else {
      <div class="crumbs-wrapper">
        <div class="crumbs">
          <button>{{ t('loading') }}</button>
          <span class="divider">&nbsp;</span>
          <span class="number">&nbsp;</span>
        </div>

        <div class="save-pfp">
          <button class="disabled">{{ t('downloadPfp') }}</button>
        </div>
      </div>
    }
  </div>
</div>

<canvas #pfp id="pfp" width="480" height="480" style="display: none;"></canvas>
