<a class="auction-card" routerLink="/auction" (click)="navigate.emit()">
  <div class="title">
    <!-- The auction house's own animated beam-hat mark, as on its page header. -->
    <img class="logo" src="assets/images/beam.png" alt="" />
    <span>{{ title() }}</span>
    <!-- Same arrow as the other menu links: this card is a link to the auction house. -->
    <svg class="arrow" height="25" viewBox="0 0 15 25" width="15" xmlns="http://www.w3.org/2000/svg"><path d="m10 10h5v5h-5zm-5-5h5v5h-5zm0 10h5v5h-5zm-5-15h5v5h-5zm0 20h5v5h-5z" fill-rule="evenodd"/></svg>
  </div>

  @if (live()) {
    <div class="body">
      <div class="item">
        <img [src]="image()" alt="" />
        <span class="id">#{{ tokenId() }}</span>
      </div>

      <div class="stat">
        <span class="label">{{ t('bids') }}</span>
        <span class="value">{{ bidCount() }}</span>
      </div>

      <div class="stat">
        <span class="label">{{ t('current') }}</span>
        <span class="value">Ξ{{ currentEth() }}</span>
      </div>

      <div class="stat remaining">
        <span class="label">{{ t('timeRemaining') }}</span>
        <app-timer class="value" [endTime]="endTimeMs()" />
      </div>
    </div>
  }
</a>
