@if (loaded()) {
  <div class="stat-bar" [class.section]="variant() === 'section'">

    <div class="stat">
      <span class="label">{{ t('statFloor') }}</span>
      <span class="value">{{ floor() === null ? '—' : eth(floor()) + 'Ξ' }}</span>
    </div>

    <div class="stat">
      <span class="label">{{ t('statArtifacts') }}</span>
      <span class="value">{{ supply() | number }}</span>
    </div>

    <div class="stat">
      <span class="label">{{ t('statListed') }}</span>
      <span class="value">{{ listed() | number }}</span>
    </div>

    <div class="stat">
      <span class="label">{{ t('sales') }}</span>
      <span class="value">{{ sales() | number }}</span>
    </div>

    <div class="stat">
      <span class="label">{{ t('statVolume') }}</span>
      <span class="value">{{ eth(volume()) }}Ξ</span>
    </div>

  </div>
}
