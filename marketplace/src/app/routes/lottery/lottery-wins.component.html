<div class="inner">
  <div class="header-wrapper">
    <nav class="crumb-box" aria-label="Breadcrumb">
      <a routerLink="/phupreme">Phupreme</a>
      <span class="sep" aria-hidden="true">/</span>
      <span>All Won Artifacts</span>
    </nav>
    <h1>All Won Artifacts</h1>
    <h3>Showing <span class="highlight">{{ wins().length }}</span> wins</h3>
  </div>

  @if (!loaded()) {
  } @else if (wins().length === 0) {
    <p class="empty-message">No wins yet.</p>
  } @else {
    <div class="wins-grid">
      @for (win of wins(); track win.play_id) {
        <div class="item">
          <a class="item-link" [routerLink]="['/details', win.hash_id]">
            <div class="image-wrapper">
              @if (win.sha) {
                <app-phunk-image [sha]="win.sha" />
              } @else {
                <img src="/assets/images/lottery/philip.png" width="50" height="50" />
              }
            </div>
            <div class="labels-wrapper">
              <div class="label">#{{ win.token_id }}</div>
            </div>
          </a>
        </div>
      }
    </div>
  }
</div>
