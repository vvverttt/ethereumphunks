<div class="inner">
  <div class="header-wrapper">
    <nav class="crumb-box" aria-label="Breadcrumb">
      <a routerLink="/phupreme">Phupreme</a>
      <span class="sep" aria-hidden="true">/</span>
      <span>Lottery Pool</span>
    </nav>
    <h1>Lottery Pool</h1>
    <h3>Showing <span class="highlight">{{ items().length }}</span> of <span class="highlight">{{ totalSize() }}</span> QuantumPhunks in pool</h3>
  </div>

  @if (!loaded()) {
    <p class="loading-message">Loading pool...</p>
  } @else if (items().length === 0) {
    <p class="empty-message">Pool is empty.</p>
  } @else {
    <app-phunk-grid
      [phunkData]="$any(items())"
      [viewType]="'compact'"
      [limit]="5000"
      [marketType]="'all'"
      [activeSort]="'id'"
    />
    @if (hasMore()) {
      <button class="load-more" [disabled]="loadingMore()" (click)="loadMore()">
        {{ loadingMore() ? 'Loading...' : 'Load More' }}
      </button>
    }
  }
</div>
