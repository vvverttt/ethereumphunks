<div class="inner">

  <div class="header-wrapper">
    <a class="button" [routerLink]="['/', slug()]">
      &lt; {{ collectionName() }}
    </a>

    <h1>{{ t('salesAllTitle', { name: collectionName() }) }}</h1>

    @if (!loading()) {
      <p class="count">{{ t('salesShowing', { n: (sales().length | number) || '0' }) }}</p>
    } @else {
      <p class="count">{{ t('salesLoading') }}</p>
    }
  </div>

  @if (sales().length) {
    <app-phunk-grid
      [phunkData]="sales()"
      [viewType]="'market'"
      [marketType]="'listings'"
      [activeSort]="'recently-listed'"
      [limit]="1000"
      [observe]="false"
      [showDate]="true"
    />
  } @else if (!loading()) {
    <p class="no-sales">{{ t('salesNoneForCollection') }}</p>
  }

</div>
