<div class="auction-page" [ngStyle]="{'--auction-accent': accentColor() || null}">
  @if (loading()) {
    <div class="loading-state">Loading auction...</div>
  } @else {

    <!-- ========== HERO SECTION ========== -->
    <section class="auction" [style.background-image]="accentColor() ? 'linear-gradient(rgba(' + accentColor() + ', 0.15), rgba(' + accentColor() + ', 0.15))' : null">
      <div class="inner">

        <!-- Phunk Image (left) -->
        <div class="phunk-image-wrapper">
          @if (phunkImage()) {
            <img [src]="phunkImage()" class="phunk-fallback" crossorigin="anonymous" (load)="onMainImageLoad($event)" />
          } @else {
            <div class="placeholder"></div>
          }
        </div>

        <!-- Phunk Info (right, within hero) -->
        <app-phunk-info
          [collectionName]="collectionName() || 'QuantumPhunk'"
          [tokenId]="phunkTokenId()"
          [slug]="phunkSlug()"
          [sha]="phunkSha()"
          [poolSize]="poolSize()"
          [canGoPrev]="canGoPrev()"
          [canGoNext]="canGoNext()"
          (prevAuction)="prevAuction()"
          (nextAuction)="nextAuction()"
        />

        <!-- Bid Panel (absolutely positioned, overlapping hero/slider) -->
        <app-bid-panel
          [auction]="auction()"
          [bids]="bids()"
          [connected]="!!(connected$ | async)"
          [auctionEnded]="auctionEnded()"
          [reservePrice]="reservePrice()"
          [minBidIncrement]="minBidIncrement()"
          [txPending]="txPending()"
          [txHash]="txHash()"
          [errorMessage]="errorMessage()"
          [explorerUrl]="explorerUrl"
          [isHistorical]="isHistorical()"
          [noAuction]="!hasActiveAuction && !isHistorical()"
          (placeBid)="onPlaceBid($event)"
          (settle)="onSettle()"
          (connect)="web3Svc.connect()"
          (closeError)="closeError()"
          (closeTx)="txHash.set('')"
          (timerEvent)="handleTimerEvent($event)"
        />
      </div>
    </section>

    <!-- ========== AUCTION HISTORY SLIDER ========== -->
    <section class="auction-history">
      <app-auction-slider
        [settledAuctions]="allAuctions()"
        (selectAuction)="navigateToAuction($event)"
      />
    </section>


  }
</div>
