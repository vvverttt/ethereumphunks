@let address = address$ | async;
@let me = connected$ | async;
@let ens = ens$ | async;

<div class="inner">
  @if (!address) {
    <!-- signed out: the bank machine, asking for a card (Connect) -->
    <app-phunk-atm class="atm-wrap full" [wallet]="null" [reserve]="(reserve$ | async) || []" (connectWallet)="connect()" />
  } @else {
    @if (shelf$ | async; as shelf) {
      <!-- every wallet opens in the bank machine; only your own can make moves in it -->
      <app-phunk-atm class="atm-wrap full" [groups]="shelf.held" [missing]="shelf.missing" [reserve]="shelf.all" [wallet]="shelf.address" [ens]="ens"
        [preview]="preview || me !== shelf.address" (changed)="refresh(shelf.address)" />
    } @else {
      <p class="note">…</p>
    }
  }
</div>
