<!--
  Phalace — a Palace-style lockup for the QuantumPhunks drops.

  Built as three corner triangles that together imply a larger one, leaving an inverted
  void at the centre. Original geometry rather than a traced mark: the corner pieces are
  the three triangles formed by joining the outer vertices to the midpoints of the sides,
  so the whole thing is derived from one equilateral triangle and stays exact at any size.

  SVG loaded through <img> cannot fetch webfonts, so the wordmark uses a heavy system
  stack. textLength pins the width so it reads the same whichever of those is present.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-label="Phalace">
  <title>Phalace</title>

  <g transform="translate(80, 8)">
    <!-- top corner -->
    <polygon points="80,10 120,80 40,80" fill="#ffffff"/>
    <!-- bottom-right corner -->
    <polygon points="120,80 160,150 80,150" fill="#ffffff"/>
    <!-- bottom-left corner -->
    <polygon points="40,80 80,150 0,150" fill="#ffffff"/>
  </g>

  <!-- Wordmark, wide-tracked under the mark. -->
  <text x="160" y="212"
        text-anchor="middle"
        textLength="290"
        lengthAdjust="spacingAndGlyphs"
        font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="46"
        letter-spacing="6"
        fill="#ffffff">PHALACE</text>
</svg>
